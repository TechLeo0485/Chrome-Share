<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TabShare — Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #202124;
      color: #e8eaed;
    }

    .centerScreen {
      max-width: 480px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .centerScreen h1 { font-size: 20px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      font-size: 18px;
      font-family: monospace;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #555;
      background: #303134;
      color: #e8eaed;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #1a73e8; color: white; width: 100%; }
    #joinStatus { margin-top: 12px; font-size: 13px; color: #bbb; min-height: 18px; }
    .error { color: #f28b82 !important; }

    #sessionScreen {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #303134;
      font-size: 13px;
    }
    #leaveBtn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: #ea4335;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    #videoWrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      outline: none;
      background: #000;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: default;
    }

    #linkPopup {
      display: none;
      position: absolute;
      z-index: 10;
      align-items: center;
      gap: 8px;
      max-width: 360px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #303134;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      font-size: 13px;
    }
    #linkPopupUrl {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
      color: #8ab4f8;
    }
    #linkPopupUrl.empty { color: #9aa0a6; font-style: italic; }
    #linkPopupCopy {
      padding: 6px 10px;
      font-size: 12px;
      background: #1a73e8;
      color: white;
    }
    #linkPopupCopy.copied { background: #34a853; }
  </style>
</head>
<body>
  <div id="joinScreen" class="centerScreen">
    <h1>Join a shared tab</h1>
    <p>Enter the code your friend sent you:</p>
    <input id="hostCodeInput" type="text" placeholder="tabshare-xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
    <div class="row">
      <button id="joinBtn" class="primary">Join</button>
    </div>
    <div id="joinStatus"></div>
  </div>

  <div id="sessionScreen">
    <div id="topBar">
      <span id="sessionStatus">Connecting…</span>
      <button id="leaveBtn">Leave</button>
    </div>
    <div id="videoWrap" tabindex="0">
      <video id="remoteVideo" autoplay playsinline></video>
      <div id="linkPopup">
        <span id="linkPopupUrl"></span>
        <button id="linkPopupCopy" type="button">Copy link</button>
      </div>
    </div>
  </div>

  <script src="shared/rtc-config.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
