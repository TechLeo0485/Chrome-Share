<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bgShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgShade)"/>

  <!-- browser tab / window: plain white panel with a simple top bar, no fine detail -->
  <g>
    <rect x="22" y="26" width="62" height="46" rx="7" fill="#FFFFFF"/>
    <path d="M22,33 a7,7 0 0 1 7,-7 h48 a7,7 0 0 1 7,7 v6 h-62 z" fill="#4338CA" fill-opacity="0.55"/>
  </g>

  <!-- cursor / remote-control pointer, bold and high-contrast, popping over the corner -->
  <g transform="translate(64,52)">
    <path d="M0,0 L0,40 L10,31 L16.3,45.5 L24.2,42 L18,27.5 L30.5,27.5 Z"
          fill="#FBBF24" stroke="#3B2100" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
